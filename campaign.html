<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muaawina Campaign</title><link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Raleway:wght@600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#183153;font:15px Arial,sans-serif}main{max-width:1050px;margin:auto;padding:20px}h1{font-size:24px;margin:8px 0}p{white-space:pre-wrap;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:24px}.panel{background:#fff;border-radius:18px;padding:20px}label{display:block;margin:12px 0 5px;font-size:13px}input,textarea,select,button{font:inherit;max-width:100%}input:not([type=checkbox]),textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{border:0;border-radius:10px;padding:12px 18px;background:#1e3a8a;color:white;margin-top:12px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}canvas{width:100%;height:auto;display:block;max-height:75vh;object-fit:contain}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{color:#b42318;min-height:24px;margin:12px 0}.hint{font-size:12px;color:#64748b}#editor[hidden],#member[hidden]{display:none}@media(max-width:680px){.layout{grid-template-columns:1fr}main{padding:12px}.preview{grid-row:1}}
</style></head><body><main><h1 id="title">Campaign</h1><p id="description"></p><div class="layout"><section class="panel"><div id="editor" hidden>
<label><input type="checkbox" id="enabled"> Campaign ON</label><label>Campaign heading<input id="heading" maxlength="160"></label><label>Invitation / description<textarea id="caption" maxlength="1000"></textarea></label><label>Poster template (PNG / JPG / WEBP)<input type="file" id="posterFile" accept="image/png,image/jpeg,image/webp"></label><p class="hint">ഫോട്ടോയ്ക്ക് ഒഴിഞ്ഞ സ്ഥലം ഉള്ള poster ഉപയോഗിക്കുക. സ്ഥാനങ്ങൾ posterന്റെ ശതമാനത്തിലാണ്. PNG transparent cutout ഉണ്ടെങ്കിൽ photo അതിന്റെ പിന്നിൽ വരും.</p>
<div id="positions"></div><label>Photo shape<select id="shape"><option value="rectangle">Rectangle</option><option value="circle">Circle / Oval</option></select></label><label>Name font<select id="font"><option>Manjari</option><option>Raleway</option><option>Arial</option></select></label><label>Name color<input type="color" id="color" value="#183b72"></label><button id="save">Save Campaign</button></div>
<div id="member"><label>Your photo<input type="file" id="photoFile" accept="image/png,image/jpeg,image/webp"></label><label>Your name<input id="name" maxlength="80" placeholder="നിങ്ങളുടെ പേര്" autocomplete="name"></label><label>Photo zoom<input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label><label>Move photo horizontally<input id="panX" type="range" min="0" max="1" step="0.01" value="0.5"></label><label>Move photo vertically<input id="panY" type="range" min="0" max="1" step="0.01" value="0.5"></label><button id="download" disabled>Download Poster</button></div><p id="status" class="status" role="status"></p></section><section class="panel preview"><canvas id="canvas" width="800" height="800" aria-label="Campaign poster preview"></canvas><p class="hint">Poster preview</p></section></div></main>
<script>
(()=>{
 const $=id=>document.getElementById(id),editor=location.hash==='#editor',pending=new Map();let seq=0,poster=null,photo=null,uploading=false;
 let c={enabled:false,title:'',description:'',poster:'',photoX:10,photoY:15,photoW:40,photoH:45,nameX:50,nameY:80,nameSize:4,font:'Manjari',color:'#183b72',shape:'rectangle'};
 const status=t=>$('status').textContent=t;
 function request(action,data={}){return new Promise((resolve,reject)=>{const id=++seq;const timer=setTimeout(()=>{pending.delete(id);reject(Error('Connection timed out. Please retry.'))},50000);pending.set(id,{resolve,reject,timer});parent.postMessage({type:'mua-campaign',id,action,data},location.origin)})}
 window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='mua-campaign-result')return;const p=pending.get(e.data.id);if(!p)return;clearTimeout(p.timer);pending.delete(e.data.id);const r=e.data.result;r?.error?p.reject(Error(r.error)):p.resolve(r)});
 function image(src){return new Promise((resolve,reject)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{if(i.naturalWidth>6000||i.naturalHeight>6000||i.naturalWidth*i.naturalHeight>20000000)reject(Error('Image dimensions are too large; use a smaller image'));else resolve(i)};i.onerror=()=>reject(Error('Image could not load. Check the uploaded poster and retry.'));i.src=src})}
 function read(file){return new Promise((resolve,reject)=>{if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))return reject(Error('Choose PNG, JPG or WEBP'));if(file.size>7*1024*1024)return reject(Error('Please choose an image below 7 MB'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read image'));r.readAsDataURL(file)})}
 const fields={photoX:'Photo left',photoY:'Photo top',photoW:'Photo width',photoH:'Photo height',nameX:'Name center X',nameY:'Name baseline Y',nameSize:'Name size'};
 for(const [k,label] of Object.entries(fields)){const l=document.createElement('label');l.textContent=label+' (%)';const input=document.createElement('input');input.id=k;input.type='number';input.min=k==='nameSize'?.5:0;input.max=k==='nameSize'?15:100;input.step='.5';input.value=c[k];input.oninput=()=>{c[k]=Number(input.value);draw()};l.append(input);$('positions').append(l)}
 function fill(){for(const k of Object.keys(fields))$(k).value=c[k];$('enabled').checked=c.enabled;$('heading').value=c.title;$('caption').value=c.description;for(const k of ['shape','font','color'])$(k).value=c[k];$('title').textContent=c.title||'Campaign Settings';$('description').textContent=c.description||''}
 function draw(){const cv=$('canvas'),ctx=cv.getContext('2d');cv.width=poster?poster.naturalWidth:800;cv.height=poster?poster.naturalHeight:800;const w=cv.width,h=cv.height;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
 const x=w*c.photoX/100,y=h*c.photoY/100,pw=w*c.photoW/100,ph=h*c.photoH/100;
 function portrait(){if(pw<=0||ph<=0)return;ctx.save();ctx.beginPath();if(c.shape==='circle')ctx.ellipse(x+pw/2,y+ph/2,pw/2,ph/2,0,0,Math.PI*2);else ctx.rect(x,y,pw,ph);ctx.clip();ctx.fillStyle='#dbeafe';ctx.fillRect(x,y,pw,ph);if(photo){const scale=Math.max(pw/photo.width,ph/photo.height)*Number($('zoom').value),iw=photo.width*scale,ih=photo.height*scale;ctx.drawImage(photo,x-(iw-pw)*Number($('panX').value),y-(ih-ph)*Number($('panY').value),iw,ih)}else if(editor){ctx.fillStyle='#1e3a8a';ctx.font=Math.max(14,w*.025)+'px Arial';ctx.textAlign='center';ctx.fillText('PHOTO',x+pw/2,y+ph/2)}ctx.restore()}
 // Transparent templates frame the photo; opaque templates receive it on top.
 
 // Draw photo first, then preserve transparent frame detail where present.
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);portrait();if(poster)ctx.drawImage(poster,0,0);
 if(poster){const test=document.createElement('canvas');test.width=1;test.height=1;const t=test.getContext('2d');t.drawImage(poster,x+pw/2,y+ph/2,1,1,0,0,1,1);if(t.getImageData(0,0,1,1).data[3]>250)portrait()}
 ctx.fillStyle=c.color;ctx.textAlign='center';let size=w*c.nameSize/100;ctx.font='700 '+size+'px "'+c.font+'", Manjari, sans-serif';const text=$('name').value.trim()||(editor?'നിങ്ങളുടെ പേര്':'');const max=w*.9;while(ctx.measureText(text).width>max&&size>5){size--;ctx.font='700 '+size+'px "'+c.font+'", Manjari, sans-serif'}ctx.fillText(text,w*c.nameX/100,h*c.nameY/100);$('download').disabled=!poster||!photo||!$('name').value.trim();}
 ['name','zoom','panX','panY'].forEach(k=>$(k).oninput=draw);['shape','font','color'].forEach(k=>$(k).oninput=async()=>{c[k]=$(k).value;await document.fonts.load('700 30px "'+c.font+'"');await document.fonts.ready;draw()});
 $('photoFile').onchange=async e=>{try{photo=await image(await read(e.target.files[0]));$('zoom').value=1;$('panX').value=$('panY').value=.5;draw();status('')}catch(e){status(e.message)}};
 $('posterFile').onchange=async e=>{uploading=true;$('save').disabled=true;try{const file=e.target.files[0],base64=await read(file);status('Uploading poster…');const r=await request('uploadPosterPhoto',{base64,mimeType:file.type,fileName:file.name});if(!r.success||!r.url)throw Error(r.error||'Upload failed');const next=await image(r.url);c.poster=r.url;poster=next;draw();status('Poster uploaded. Preview and Save Campaign.')}catch(e){status(e.message)}finally{uploading=false;$('save').disabled=false}};
 $('save').onclick=async()=>{if(uploading)return;$('save').disabled=true;status('Saving…');try{c.enabled=$('enabled').checked;c.title=$('heading').value;c.description=$('caption').value;const r=await request('savePosterCampaign',c);c=r.campaign;fill();draw();status('Campaign saved successfully.')}catch(e){status(e.message)}finally{$('save').disabled=false}};
 $('download').onclick=async()=>{try{await document.fonts.load('700 30px "'+c.font+'"');await document.fonts.ready;draw();$('canvas').toBlob(blob=>{if(!blob)return status('Download failed');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Muaawina-Campaign.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')}catch(e){status('Could not export poster. Please re-upload the template.')}};
 async function init(){if(parent===window){status('Open this campaign from the Muaawina app.');return}$('editor').hidden=!editor;$('member').hidden=editor;try{const r=await request('getPosterCampaign');c={...c,...r.campaign};fill();if(!editor&&!c.enabled){status('This campaign is currently closed.');$('member').hidden=true;return}if(c.poster)poster=await image(c.poster);await document.fonts.load('700 30px "'+c.font+'"');await document.fonts.ready;draw()}catch(e){status(e.message)}}init();
})();
</script></body></html>
