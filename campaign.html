<!doctype html>
<html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muaawina Campaign</title>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Montserrat:wght@400;700&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#183153;font:14px Arial,sans-serif}button,input,textarea,select{font:inherit}button,.upload{border:0;border-radius:11px;padding:11px 14px;min-height:42px;background:#1e3a8a;color:#fff;cursor:pointer;text-align:center}button:disabled{opacity:.45;cursor:wait}button:focus-visible,.upload:focus-within,canvas:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}[hidden]{display:none!important}main{height:100dvh;max-width:1000px;margin:auto;display:flex;flex-direction:column;gap:8px;padding:12px}header{flex:none;text-align:center}h1{font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#description{font-size:12px;color:#64748b;margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.workspace{flex:1;min-height:80px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#dfe8f4;padding:10px;overflow:hidden}.workspace canvas{display:block;touch-action:none;user-select:none;box-shadow:0 5px 22px #18315315;background:#fff;cursor:grab}canvas:active{cursor:grabbing}.controls{flex:none;padding:10px;background:#fff;border-radius:16px;display:grid;gap:8px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tools{justify-content:center}.tools>*{flex:0 1 auto}.secondary{background:#edf3fc;color:#1e3a8a;border:1px solid #d7e3f3}.selected{background:#1e3a8a;color:#fff}input:not([type=checkbox]),select,textarea{padding:10px;border:1px solid #ccd8e8;border-radius:9px;min-width:0;width:100%;font-size:16px}input[type=color]{height:42px;padding:4px}.upload{display:block;white-space:nowrap;font-size:13px}.file{display:none!important}.hint{font-size:12px;text-align:center;color:#526580;margin:0;min-height:15px}.status{font-size:12px;color:#b42318;margin:0;overflow-wrap:anywhere}.status:empty{display:none}.actions{display:grid;gap:6px}.actions button{padding:10px}.share{background:#e7f5ee;color:#137b47}dialog{border:0;border-radius:18px;padding:20px;max-width:460px;width:calc(100% - 24px);max-height:90dvh;overflow:auto;color:#183153}dialog::backdrop{background:#10254477}dialog h2{font-size:18px;margin:0 0 12px}dialog label{display:block;font-size:13px;margin:12px 0 5px}dialog .row label{margin:0}#editorTools button{font-size:13px;padding:9px 12px}#status{max-height:38px;overflow:auto}@media(min-width:760px){main{padding:20px;gap:12px}.controls{max-width:700px;width:100%;align-self:center}}@media(max-height:570px){main{padding:6px;gap:4px}.controls{padding:6px;gap:4px}button,.upload{padding:7px 10px;min-height:34px}.hint{font-size:11px}#description{display:none}}
</style></head><body><main>
<header><h1 id="title">Campaign</h1><p id="description"></p></header>
<div id="stage" class="workspace"><canvas id="canvas" width="800" height="800" tabindex="0" aria-label="Poster preview. Drag to move, pinch or use plus and minus to resize."></canvas></div>
<section class="controls">
<div id="editorTools" hidden class="row"><button type="button" id="uploadPoster">Upload Poster</button><input class="file" hidden type="file" id="posterFile" accept="image/png,image/jpeg,image/webp"><button id="settings" class="secondary" type="button">Settings</button></div>
<div id="memberTools" class="row"><button type="button" id="uploadPhoto">Your Photo</button><input class="file" hidden id="photoFile" type="file" accept="image/png,image/jpeg,image/webp"><textarea id="name" rows="1" maxlength="100" placeholder="നിങ്ങളുടെ പേര്" aria-label="Your name. The poster layout is set by the admin." autocomplete="name" style="resize:none"></textarea></div>
<div class="row tools"><div id="targets" class="row" hidden><button type="button" id="targetPhoto" class="selected">Photo</button><button type="button" id="targetName" class="secondary">Name box</button></div><button type="button" id="boldName" class="selected" aria-pressed="true" aria-label="Bold name">Bold</button><button type="button" id="smaller" class="secondary" aria-label="Make selected item smaller">−</button><button type="button" id="larger" class="secondary" aria-label="Make selected item larger">+</button><button type="button" id="reset" class="secondary">Reset</button></div>
<p id="hint" class="hint">Drag photo · Pinch to zoom</p>
<div id="memberActions" class="actions"><button id="download" disabled>Download Poster</button><button id="share" class="share" disabled>Share Poster</button></div><button id="save" hidden>Save Campaign</button><p id="status" class="status" role="status"></p>
</section>
</main>
<dialog id="settingsDialog"><h2>Campaign Settings</h2><label><input id="enabled" type="checkbox"> Campaign ON</label><label for="heading">Campaign heading</label><input id="heading" maxlength="160"><label for="caption">Invitation / description</label><textarea id="caption" maxlength="1000" rows="2"></textarea><label for="nameLayout">Name layout</label><select id="nameLayout"><option value="single">Single line (original)</option><option value="stacked">Stacked / multiple lines</option></select><div class="row"><div><label for="nameAlign">Name alignment</label><select id="nameAlign"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></div><div><label for="nameLineCount">Automatic lines</label><select id="nameLineCount"><option value="2">2 lines</option><option value="3">3 lines</option><option value="4">4 lines</option></select></div></div><label><input id="nameBold" type="checkbox" checked> Bold name</label><label for="previewName">Preview name (not saved)</label><textarea id="previewName" rows="3" maxlength="100" placeholder="Lukmanul Hakeem Al Meerani"></textarea><label for="shape">Photo shape</label><select id="shape"><option value="rectangle">Rectangle</option><option value="circle">Circle / Oval</option></select><div class="row"><div><label for="font">Name font</label><select id="font"><option>Manjari</option><option>Montserrat</option><option>Raleway</option><option>Arial</option></select></div><div><label for="color">Name color</label><input id="color" type="color" value="#183b72"></div></div><p class="hint" style="margin:14px 0">Photo / Name തിരഞ്ഞെടുക്കുക. Name box തിരഞ്ഞെടുക്കുക. അകത്ത് drag ചെയ്താൽ സ്ഥാനം മാറും; edges/corners drag ചെയ്താൽ പരിധി മാറും. പേര് അതിനുള്ളിൽ സ്വയം ഒതുങ്ങും.</p><button id="settingsDone" type="button" style="width:100%">Done</button></dialog>
<script src="campaign-gestures.js"></script>
<script>
(()=>{
 const $=id=>document.getElementById(id),editor=location.hash==='#editor',G=CampaignGestures,pending=new Map(),points=new Map();let seq=0,poster=null,photo=null,uploading=false,ready=false,selected='photo',baseline=null,gesture=null,nameBox=null,alpha=null,raf=0,exportCache=null;
 let c={enabled:false,title:'',description:'',poster:'',photoX:10,photoY:15,photoW:40,photoH:45,nameX:50,nameY:80,nameSize:4,font:'Manjari',color:'#183b72',shape:'rectangle',nameLayout:'single',nameAlign:'center',nameLineCount:3,nameBold:true},crop={zoom:1,dx:0,dy:0};
 const cv=$('canvas'),status=t=>$('status').textContent=t;
 function request(action,data={}){return new Promise((resolve,reject)=>{const id=++seq,timer=setTimeout(()=>{pending.delete(id);reject(Error('Connection timed out. Please retry.'))},50000);pending.set(id,{resolve,reject,timer});parent.postMessage({type:'mua-campaign',id,action,data},location.origin)})}
 window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='mua-campaign-result')return;const p=pending.get(e.data.id);if(!p)return;clearTimeout(p.timer);pending.delete(e.data.id);const r=e.data.result;r?.error?p.reject(Error(r.error)):p.resolve(r)});
 function image(src){return new Promise((resolve,reject)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>i.naturalWidth>6000||i.naturalHeight>6000||i.naturalWidth*i.naturalHeight>20000000?reject(Error('Image is too large. Choose a smaller image.')):resolve(i);i.onerror=()=>reject(Error('Could not load image. Please retry the upload.'));i.src=src})}
 function read(file){return new Promise((resolve,reject)=>{if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))return reject(Error('Choose PNG, JPG or WEBP'));if(file.size>7*1024*1024)return reject(Error('Choose an image below 7 MB'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read image'));r.readAsDataURL(file)})}
 async function fontReady(){await document.fonts.load((c.nameBold?'700':'400')+' 30px "'+c.font+'"');await document.fonts.ready}
 function syncBold(){$('nameBold').checked=c.nameBold;$('boldName').setAttribute('aria-pressed',String(c.nameBold));$('boldName').className=c.nameBold?'selected':'secondary'}
 function fill(){syncBold();$('enabled').checked=c.enabled;$('heading').value=c.title;$('caption').value=c.description;for(const k of ['shape','font','color','nameLayout','nameAlign','nameLineCount'])$(k).value=c[k];$('name').rows=1;$('title').textContent=c.title||'Campaign Settings';$('description').textContent=c.description||''}
 function setPoster(i){poster=i;const test=document.createElement('canvas');test.width=test.height=100;const ctx=test.getContext('2d');ctx.drawImage(i,0,0,100,100);alpha=ctx.getImageData(0,0,100,100).data;const scale=Math.min(1,1400/Math.max(i.naturalWidth,i.naturalHeight));cv.width=Math.round(i.naturalWidth*scale);cv.height=Math.round(i.naturalHeight*scale);fit()}
 function fit(){const box=$('stage'),w=Math.max(1,box.clientWidth-20),h=Math.max(1,box.clientHeight-20),scale=Math.min(w/cv.width,h/cv.height);cv.style.width=cv.width*scale+'px';cv.style.height=cv.height*scale+'px'}
 function invalidate(){exportCache=null;if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
 function draw(target=cv,guides=editor){const ctx=target.getContext('2d'),w=target.width,h=target.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const x=w*c.photoX/100,y=h*c.photoY/100,pw=w*c.photoW/100,ph=h*c.photoH/100;
 function portrait(){ctx.save();ctx.beginPath();if(c.shape==='circle')ctx.ellipse(x+pw/2,y+ph/2,pw/2,ph/2,0,0,Math.PI*2);else ctx.rect(x,y,pw,ph);ctx.clip();ctx.fillStyle='#dbeafe';ctx.fillRect(x,y,pw,ph);if(photo){const scale=Math.max(pw/photo.width,ph/photo.height)*crop.zoom,iw=photo.width*scale,ih=photo.height*scale;ctx.drawImage(photo,x+(pw-iw)/2+w*crop.dx/100,y+(ph-ih)/2+h*crop.dy/100,iw,ih)}else if(editor){ctx.fillStyle='#1e3a8a';ctx.font=w*.028+'px Arial';ctx.textAlign='center';ctx.fillText('PHOTO',x+pw/2,y+ph/2)}ctx.restore()}
 portrait();if(poster)ctx.drawImage(poster,0,0,w,h);const ax=G.clamp(Math.floor(c.photoX+c.photoW/2),0,99),ay=G.clamp(Math.floor(c.photoY+c.photoH/2),0,99);if(alpha&&alpha[(ay*100+ax)*4+3]>250)portrait();
 const text=(editor?$('previewName').value:$('name').value).trim()||(editor?(c.nameLayout==='stacked'?'Lukmanul Hakeem Al Meerani':'നിങ്ങളുടെ പേര്'):'');
 ctx.fillStyle=c.color;let size=w*c.nameSize/100,tw=0;const weight=c.nameBold?'700':'400';
 if(c.useNameBox){
  const box={x:c.nameBoxX*w/100,y:c.nameBoxY*h/100,w:c.nameBoxW*w/100,h:c.nameBoxH*h/100};
  const measure=(line,fontSize)=>{ctx.font=weight+' '+Math.max(.00001,fontSize)+'px "'+c.font+'",Manjari,sans-serif';ctx.textAlign='left';const m=ctx.measureText(line),left=Math.max(0,m.actualBoundingBoxLeft||0);return {width:Math.max(m.width,left+(m.actualBoundingBoxRight??m.width)),left,ascent:m.actualBoundingBoxAscent??fontSize*.8,descent:m.actualBoundingBoxDescent??fontSize*.2}};
  const fitted=G.fitName(text,c,box,size,measure);size=fitted.size;ctx.font=weight+' '+Math.max(.00001,size)+'px "'+c.font+'",Manjari,sans-serif';ctx.textAlign='left';ctx.save();ctx.beginPath();ctx.rect(box.x,box.y,box.w,box.h);ctx.clip();fitted.lines.forEach((line,i)=>{const m=fitted.m[i],offset=c.nameAlign==='right'?box.w-m.width:c.nameAlign==='center'?(box.w-m.width)/2:0;ctx.fillText(line,box.x+offset+m.left,box.y+fitted.ascent+i*fitted.step)});ctx.restore();
  nameBox={x:c.nameBoxX,y:c.nameBoxY,w:c.nameBoxW,h:c.nameBoxH};tw=box.w;
 }else{
 ctx.textAlign=c.nameAlign;
 const setFont=()=>ctx.font=weight+' '+size+'px "'+c.font+'",Manjari,sans-serif';setFont();
 const lines=G.nameLines(text,c.nameLayout,c.nameLineCount,s=>ctx.measureText(s).width),available=c.nameAlign==='left'?100-c.nameX:c.nameAlign==='right'?c.nameX:2*Math.min(c.nameX,100-c.nameX),max=Math.max(1,available*w/100);
 const width=()=>Math.max(0,...lines.map(t=>ctx.measureText(t).width));
 while((width()>max||(lines.length-1)*size*1.02+size*.25>(100-c.nameY)*h/100)&&size>5){size--;setFont()}
 const lineHeight=size*1.02;lines.forEach((line,i)=>ctx.fillText(line,w*c.nameX/100,h*c.nameY/100+i*lineHeight));tw=width();const left=c.nameAlign==='left'?c.nameX:c.nameAlign==='right'?c.nameX-tw/w*100:c.nameX-tw/w*50;
 nameBox={x:left,y:c.nameY-size/h*100,w:tw/w*100,h:(size*1.25+Math.max(0,lines.length-1)*lineHeight)/h*100};
 }

 if(guides){ctx.save();ctx.strokeStyle='#2563eb';ctx.lineWidth=Math.max(2,w/300);ctx.setLineDash([w/100,w/150]);const b=selected==='photo'?{x,y,w:pw,h:ph}:{x:nameBox.x*w/100,y:nameBox.y*h/100,w:c.useNameBox?tw:Math.max(tw,w*.06),h:nameBox.h*h/100};ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.setLineDash([]);ctx.fillStyle='#2563eb';const r=w*.012;if(selected==='name'&&c.useNameBox){for(const [hx,hy] of [[0,0],[.5,0],[1,0],[0,.5],[1,.5],[0,1],[.5,1],[1,1]])ctx.fillRect(b.x+b.w*hx-r,b.y+b.h*hy-r,r*2,r*2)}else ctx.fillRect(b.x+b.w-r,b.y+b.h-r,r*2,r*2);ctx.restore()}
 const valid=ready&&poster&&photo&&$('name').value.trim();$('download').disabled=$('share').disabled=!valid;
 }
 function select(target){if(editor&&target==='name'&&!c.useNameBox&&nameBox){c.useNameBox=true;c.nameBoxX=G.clamp(nameBox.x,0,99);c.nameBoxY=G.clamp(nameBox.y,0,99);c.nameBoxW=G.clamp(Math.max(15,nameBox.w),1,100-c.nameBoxX);c.nameBoxH=G.clamp(Math.max(6,nameBox.h),1,100-c.nameBoxY)}selected=target;$('targetPhoto').className=target==='photo'?'selected':'secondary';$('targetName').className=target==='name'?'selected':'secondary';invalidate()}
 function point(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100}}
 function info(){const p=[...points.values()];if(p.length<2)return {center:p[0],distance:0};return {center:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2},distance:Math.hypot((p[1].x-p[0].x)*cv.width,(p[1].y-p[0].y)*cv.height)}}
 function begin(){if(!points.size){gesture=null;return}gesture={...info(),c:{...c},crop:{...crop},target:selected}}
 cv.onpointerdown=e=>{if(!ready)return;if(!editor&&!photo)return;e.preventDefault();const p=point(e);if(editor&&points.size===0){if(nameBox&&p.x>=nameBox.x-3&&p.x<=nameBox.x+nameBox.w+3&&p.y>=nameBox.y-3&&p.y<=nameBox.y+nameBox.h+3)select('name');else if(p.x>=c.photoX&&p.x<=c.photoX+c.photoW&&p.y>=c.photoY&&p.y<=c.photoY+c.photoH)select('photo')}
 points.set(e.pointerId,p);cv.setPointerCapture(e.pointerId);begin();if(editor&&points.size===1){const b=selected==='photo'?{x:c.photoX,y:c.photoY,w:c.photoW,h:c.photoH}:nameBox;const r=cv.getBoundingClientRect();if(selected==='name'&&c.useNameBox){const tx=Math.min(1400/r.width,b.w/3),ty=Math.min(1400/r.height,b.h/3),inside=p.x>=b.x-tx&&p.x<=b.x+b.w+tx&&p.y>=b.y-ty&&p.y<=b.y+b.h+ty;let handle='';if(inside){if(Math.abs(p.x-b.x)<tx)handle+='w';else if(Math.abs(p.x-b.x-b.w)<tx)handle+='e';if(Math.abs(p.y-b.y)<ty)handle+='n';else if(Math.abs(p.y-b.y-b.h)<ty)handle+='s'}gesture.handle=handle}else if(b&&Math.abs(p.x-b.x-b.w)<1400/r.width&&Math.abs(p.y-b.y-b.h)<1400/r.height)gesture.resize=true}};
 cv.onpointermove=e=>{if(!points.has(e.pointerId)||!gesture)return;e.preventDefault();points.set(e.pointerId,point(e));const now=info(),dx=now.center.x-gesture.center.x,dy=now.center.y-gesture.center.y;let factor=gesture.distance>0&&now.distance>0?now.distance/gesture.distance:1;
 if(editor){if(gesture.handle&&gesture.target==='name'){c=G.resizeNameBox(gesture.c,dx,dy,gesture.handle);invalidate();return}if(gesture.resize){const base=gesture.target==='photo'?gesture.c.photoW:gesture.c.nameSize*3;factor=Math.max(.05,1+dx/Math.max(1,base))}c=G.move(G.scale(gesture.c,gesture.target,factor),gesture.target,gesture.resize?0:dx,gesture.resize?0:dy)}else{crop=G.crop(gesture.crop,c,factor,gesture.center);crop.dx+=dx;crop.dy+=dy}invalidate()};
 function end(e){if(!points.has(e.pointerId))return;points.delete(e.pointerId);begin()}
 cv.onpointerup=cv.onpointercancel=cv.onlostpointercapture=end;
 function resize(factor,anchor={x:c.photoX+c.photoW/2,y:c.photoY+c.photoH/2}){if(!ready)return;if(editor)c=G.scale(c,selected,factor);else if(photo)crop=G.crop(crop,c,factor,anchor);invalidate()}
 cv.addEventListener('wheel',e=>{if(!ready||(!editor&&!photo))return;e.preventDefault();resize(Math.exp(-e.deltaY*.002),point(e))},{passive:false});
 cv.onkeydown=e=>{const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(moves[e.key]){e.preventDefault();const [x,y]=moves[e.key];if(editor)c=G.move(c,selected,x,y);else{crop.dx+=x;crop.dy+=y}invalidate()}else if(e.key==='+'||e.key==='='){e.preventDefault();resize(1.1)}else if(e.key==='-'){e.preventDefault();resize(1/1.1)}};
 async function changeBold(value){c.nameBold=value;syncBold();invalidate();try{await fontReady();invalidate()}catch(e){status('Font unavailable. Check your connection.')}}
 $('boldName').onclick=()=>{if(editor)changeBold(!c.nameBold)};$('nameBold').onchange=()=>changeBold($('nameBold').checked);
 $('targetPhoto').onclick=()=>select('photo');$('targetName').onclick=()=>select('name');$('smaller').onclick=()=>resize(1/1.12);$('larger').onclick=()=>resize(1.12);$('reset').onclick=()=>{if(editor&&baseline){for(const k of ['photoX','photoY','photoW','photoH','nameX','nameY','nameSize','useNameBox','nameBoxX','nameBoxY','nameBoxW','nameBoxH'])c[k]=baseline[k]}crop={zoom:1,dx:0,dy:0};invalidate()};$('name').oninput=invalidate;$('previewName').oninput=invalidate;
 $('settings').onclick=()=>$('settingsDialog').showModal();$('settingsDone').onclick=()=>{$('settingsDialog').close();c.title=$('heading').value;c.description=$('caption').value;$('title').textContent=c.title||'Campaign Settings';$('description').textContent=c.description;fit()};
 ['shape','font','color','nameLayout','nameAlign','nameLineCount'].forEach(k=>$(k).oninput=async()=>{c[k]=k==='nameLineCount'?Number($(k).value):$(k).value;$('name').rows=1;invalidate();try{await fontReady();invalidate()}catch(e){status('Font unavailable. Check your connection.')}});
 $('uploadPhoto').onclick=()=>$('photoFile').click();$('uploadPoster').onclick=()=>$('posterFile').click();
 $('photoFile').onchange=async e=>{if(!e.target.files[0])return;try{photo=await image(await read(e.target.files[0]));crop={zoom:1,dx:0,dy:0};invalidate();status('')}catch(e){status(e.message)}finally{e.target.value=''}};
 $('posterFile').onchange=async e=>{if(!e.target.files[0])return;uploading=true;$('save').disabled=true;try{const file=e.target.files[0],base64=await read(file);await image(base64);status('Uploading poster…');const r=await request('uploadPosterPhoto',{base64,mimeType:file.type,fileName:file.name});if(!r.success||!r.url)throw Error(r.error||'Upload failed');const i=await image(r.url);setPoster(i);c.poster=r.url;invalidate();status('Poster ready. Drag Photo / Name, then Save.')}catch(e){status(e.message)}finally{uploading=false;$('save').disabled=false;e.target.value=''}};
 $('save').onclick=async()=>{if(uploading||!ready)return;$('save').disabled=true;status('Saving…');try{c.enabled=$('enabled').checked;c.title=$('heading').value;c.description=$('caption').value;const r=await request('savePosterCampaign',c);c=r.campaign;baseline={...c};fill();invalidate();status('Campaign saved.')}catch(e){status(e.message)}finally{$('save').disabled=false}};
 function exportBlob(){if(exportCache)return exportCache;exportCache=(async()=>{await fontReady();const out=document.createElement('canvas');out.width=poster?poster.naturalWidth:cv.width;out.height=poster?poster.naturalHeight:cv.height;draw(out,false);return new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(Error('Could not create poster')),'image/png'))})();exportCache.catch(()=>exportCache=null);return exportCache}
 async function download(){const blob=await exportBlob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Muaawina-Campaign.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
 $('download').onclick=async()=>{try{await download();status('')}catch(e){status('Could not download. Please retry.')}};
 // Warm the PNG so navigator.share can run during the next tap's activation.
